name: Auto Build & Release (Signed APK)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Signed Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android-native/gradlew

      - name: Build Android Release APK
        run: |
          cd android-native
          ./gradlew assembleRelease

      - name: Locate Unsigned APK
        id: find_apk
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          APK_PATH=$(find android-native/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "FOUND_APK=$APK_PATH" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      # Automatically Sign APK if GitHub Secrets are provided
      - name: Sign Release APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        with:
          releaseDirectory: android-native/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Final Release APK
        run: |
          if [ -f "${{ steps.sign_app.outputs.signedReleaseFile }}" ]; then
            cp "${{ steps.sign_app.outputs.signedReleaseFile }}" "open-music-${TAG_NAME}-signed.apk"
            echo "Successfully generated signed APK: open-music-${TAG_NAME}-signed.apk"
          else
            cp "$FOUND_APK" "open-music-${TAG_NAME}.apk"
            echo "Keystore secret not set, using default release APK."
          fi

      - name: Create GitHub Release & Upload APK Asset
        uses: softprops/action-gh-release@v2
        with:
          name: "Open Music Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            open-music-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
