name: Auto Build & Release (Android & Tauri Windows)

on:
  push:
    tags:
      - 'v*'

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Sign Android Release APK (Fast Parallel Job)
  # -------------------------------------------------------------
  build-android:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android-native/gradlew

      - name: Build Android Release APK
        run: |
          cd android-native
          ./gradlew assembleRelease

      - name: Locate Unsigned APK
        id: find_apk
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          APK_PATH=$(find android-native/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "FOUND_APK=$APK_PATH" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Setup Android SDK Build Tools
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"

      # Automatically Sign APK with KeyStore Secrets
      - name: Sign Release APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        with:
          releaseDirectory: android-native/app/build/outputs/apk/release
          signingKeyBase64: ${{ env.KEYSTORE_BASE64 }}
          alias: ${{ env.KEY_ALIAS }}
          keyStorePassword: ${{ env.KEYSTORE_PASSWORD }}
          keyPassword: ${{ env.KEY_PASSWORD }}
          buildToolsVersion: 34.0.0

      - name: Prepare Final Signed APK
        run: |
          if [ -f "${{ steps.sign_app.outputs.signedReleaseFile }}" ]; then
            cp "${{ steps.sign_app.outputs.signedReleaseFile }}" "open-music-${TAG_NAME}.apk"
            echo "Successfully generated signed APK: open-music-${TAG_NAME}.apk"
          else
            cp "$FOUND_APK" "open-music-${TAG_NAME}.apk"
            echo "Keystore secret not set, using default release APK."
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: open-music-*.apk

  # -------------------------------------------------------------
  # Job 2: Build Tauri Windows Desktop (High-Speed Rust Cache)
  # -------------------------------------------------------------
  build-tauri-windows:
    name: Build Tauri Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      # 🔥 RUST CRATE CACHING (Reduces Windows Rust build time from 15+ mins to ~2 mins)
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Open Music Release ${{ github.ref_name }}'
          releaseBody: 'See release assets for Android APK and Windows Desktop installers.'
          releaseDraft: false
          prerelease: false

  # -------------------------------------------------------------
  # Job 3: Publish Unified GitHub Release
  # -------------------------------------------------------------
  publish-release:
    name: Publish Release Assets
    needs: [build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Open Music Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            open-music-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
